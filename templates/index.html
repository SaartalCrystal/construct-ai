<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Construct AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h2>CONSTRUCT AI</h2>
        <span>Создавай свои идеи</span>
    </header>

    <main>

        <h1>Преврати свою идею в реальность</h1>

        <p>
            Опиши предмет, который хочешь создать.
            Мы поможем воплотить твою задумку.
        </p>

        <form method="POST">

            <textarea
                name="description"
                placeholder="Например: хочу деревянный стул из дуба..."
                required
            ></textarea>

            <button type="submit">
                Создать модель
            </button>

        </form>

{% if result %}
    <div style="margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px;">
        <p><strong>Результат:</strong> {{ result }}</p>
    </div>

        <span id="user-input" style="display: none;">{{ result }}</span>

{% endif %}


<!-- Это контейнер для 3D-сцены -->
<div id="3d-container" style="width: 100%; height: 400px; margin-top: 20px; border: 2px dashed #ccc; border-radius: 10px;">
    <p style="text-align: center; color: #888; padding-top: 180px;">Здесь скоро появится 3D-модель</p>
</div>


    </main>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. Находим наш контейнер (серый прямоугольник)
    const container = document.getElementById('3d-container');
    
    // Очищаем его от текста "Здесь скоро появится..."
    container.innerHTML = ''; 

    // 2. Создаём сцену (мир, где будет жить наш 3D-объект)
    const scene = new THREE.Scene();

// Создаём невидимый холст 2x2 пикселя для клеточек
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2;
bgCanvas.height = 2;
const bgCtx = bgCanvas.getContext('2d');

// Цвет 1: тёмный серо-фиолетовый
bgCtx.fillStyle = '#2e2e3e'; 
bgCtx.fillRect(0, 0, 2, 2);

// Цвет 2: светлый серо-фиолетовый
bgCtx.fillStyle = '#4a4a66'; 
bgCtx.fillRect(0, 0, 1, 1); // левый верхний квадрат
bgCtx.fillRect(1, 1, 1, 1); // правый нижний квадрат

// Превращаем холст в текстуру и ставим на фон
const bgTexture = new THREE.CanvasTexture(bgCanvas);
bgTexture.wrapS = THREE.RepeatWrapping; // Повторять по горизонтали
bgTexture.wrapT = THREE.RepeatWrapping; // Повторять по вертикали
bgTexture.magFilter = THREE.NearestFilter; // Чтобы клеточки были чёткими, а не размытыми
bgTexture.repeat.set(20, 20); // Размер клетки (20x20 штук на экране)

scene.background = bgTexture; // Ставим как фон

    // 3. Создаём камеру (наши "глаза" в этом мире)
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    camera.position.z = 3; // Отодвигаем камеру назад, чтобы видеть куб

    // 4. Создаём рендерер (тот, кто рисует картинку)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement); // Кладём "холст" в наш прямоугольник

    // 5. Создаём геометрию (форму куба) и материал (из чего он сделан)
    const geometry = new THREE.BoxGeometry(1, 1, 1);
   // Получаем текст, который написал пользователь (если он есть)
const resultTextElement = document.getElementById('user-input');
let userText = "";

if (resultTextElement) {
    userText = resultTextElement.innerText.toLowerCase(); // Приводим к нижнему регистру
}

// Выбираем цвет в зависимости от слов в тексте
let cubeColor = 0x3498db; // По умолчанию синий
if (userText.includes("красн")) {
    cubeColor = 0xff0000; // Красный
} else if (userText.includes("зелен") || userText.includes("зелён")) {
    cubeColor = 0x00ff00; // Зеленый
} else if (userText.includes("желт") || userText.includes("жёлт")) {
    cubeColor = 0xffff00; // Желтый
} else if (userText.includes("черн")) {
    cubeColor = 0x000000; // Черный
} else if (userText.includes("бел")) {
    cubeColor = 0xffffff; // Белый
}

// Создаём материал с выбранным цветом
const material = new THREE.MeshStandardMaterial({ color: cubeColor });
    const cube = new THREE.Mesh(geometry, material);

// Выбираем размер куба в зависимости от слов
if (userText.includes("больш")) {
    cube.scale.set(2, 2, 2);     // Большой
} else if (userText.includes("маленьк")) {
    cube.scale.set(0.5, 0.5, 0.5); // Маленький
} else {
    cube.scale.set(1, 1, 1);     // Обычный
}

    scene.add(cube); // Добавляем куб в сцену

    // 6. Добавляем свет (иначе куб будет чёрным)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 7. Функция анимации (вызывается много раз в секунду)
    function animate() {
        requestAnimationFrame(animate); // Просим браузер вызвать эту функцию снова

        // Вращаем куб
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;

        // Рисуем сцену
        renderer.render(scene, camera);
    }

    // Запускаем анимацию!
    animate();

    // 8. Обработка изменения размера экрана (чтобы 3D не ломалось)
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
