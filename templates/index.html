<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Construct AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h2>CONSTRUCT AI</h2>
        <span>Создавай свои идеи</span>
    </header>

    <main>

        <h1>Преврати свою идею в реальность</h1>

        <p>
            Опиши предмет, который хочешь создать.
            Мы поможем воплотить твою задумку.
        </p>

        <form method="POST">

            <textarea
                name="description"
                placeholder="Например: хочу деревянный стул из дуба..."
                required
            ></textarea>

            <button type="submit">
                Создать модель
            </button>

        </form>

{% if result %}

        <span id="user-input" style="display: none;">{{ result }}</span>

{% endif %}


<!-- Это контейнер для 3D-сцены -->
<div id="3d-container" style="width: 100%; height: 400px; margin-top: 20px; border: 2px dashed #ccc; border-radius: 10px;">
    <p style="text-align: center; color: #888; padding-top: 180px;">Здесь скоро появится 3D-модель</p>
</div>


    </main>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. Находим наш контейнер (серый прямоугольник)
    const container = document.getElementById('3d-container');
    
    // Очищаем его от текста "Здесь скоро появится..."
    container.innerHTML = ''; 

    // 2. Создаём сцену (мир, где будет жить наш 3D-объект)
    const scene = new THREE.Scene();

// Создаём невидимый холст 2x2 пикселя для клеточек
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2;
bgCanvas.height = 2;
const bgCtx = bgCanvas.getContext('2d');

// Цвет 1: тёмный серо-фиолетовый
bgCtx.fillStyle = '#2e2e3e'; 
bgCtx.fillRect(0, 0, 2, 2);

// Цвет 2: светлый серо-фиолетовый
bgCtx.fillStyle = '#4a4a66'; 
bgCtx.fillRect(0, 0, 1, 1); // левый верхний квадрат
bgCtx.fillRect(1, 1, 1, 1); // правый нижний квадрат

// Превращаем холст в текстуру и ставим на фон
const bgTexture = new THREE.CanvasTexture(bgCanvas);
bgTexture.wrapS = THREE.RepeatWrapping; // Повторять по горизонтали
bgTexture.wrapT = THREE.RepeatWrapping; // Повторять по вертикали
bgTexture.magFilter = THREE.NearestFilter; // Чтобы клеточки были чёткими, а не размытыми
bgTexture.repeat.set(20, 20); // Размер клетки (20x20 штук на экране)

scene.background = bgTexture; // Ставим как фон

    // 3. Создаём камеру (наши "глаза" в этом мире)
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    camera.position.z = 3; // Отодвигаем камеру назад, чтобы видеть куб

    // 4. Создаём рендерер (тот, кто рисует картинку)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement); // Кладём "холст" в наш прямоугольник
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // 5. Создаём геометрию (форму куба) и материал (из чего он сделан)
   
// Получаем текст
const resultTextElement = document.getElementById('user-input');
let userText = "";
if (resultTextElement) {
    userText = resultTextElement.innerText.toLowerCase();
}

// Выбираем размер
    // 1. Базовый размер
    let baseSize = 1; 
    if (userText.includes("больш")) baseSize = 2;
    if (userText.includes("маленьк")) baseSize = 0.5;

    // 2. Пропорции
    let scaleX = 1;
    let scaleY = 1;
    let scaleZ = 1;

    // 3. Сжатие и вытягивание
    if (userText.includes("высок") || userText.includes("ножк") || userText.includes("длин")) {
        scaleY = 3; // Тянем вверх
    }
    if (userText.includes("плоск") || userText.includes("низк") || userText.includes("крыш")) {
        scaleY = 0.2; // Сжимаем в блин
    }
    if (userText.includes("широк") || userText.includes("толст")) {
        scaleX = 2;
        scaleZ = 2;
    }

    // 4. Сама форма
    let geometry;
    if (userText.includes("шар") || userText.includes("кругл")) {
        geometry = new THREE.SphereGeometry(baseSize / 2, 32, 32); 
    } else if (userText.includes("цилиндр") || userText.includes("труб")) {
        if (userText.includes("пирамид") || userText.includes("усечен")) {
            geometry = new THREE.CylinderGeometry(baseSize / 4, baseSize / 2, baseSize, 32); 
        } else {
            geometry = new THREE.CylinderGeometry(baseSize / 2, baseSize / 2, baseSize, 32);
        }
    } else if (userText.includes("пирамид") || userText.includes("треуголь")) {
        geometry = new THREE.ConeGeometry(baseSize / 2, baseSize, 4); 
    } else {
        geometry = new THREE.BoxGeometry(baseSize, baseSize, baseSize);
    }

// Выбираем цвет в зависимости от слов в тексте
let cubeColor = 0x3498db; // По умолчанию синий
if (userText.includes("красн")) {
    cubeColor = 0xff0000; // Красный
} else if (userText.includes("зелен") || userText.includes("зелён")) {
    cubeColor = 0x00ff00; // Зеленый
} else if (userText.includes("желт") || userText.includes("жёлт")) {
    cubeColor = 0xffff00; // Желтый
} else if (userText.includes("черн")) {
    cubeColor = 0x000000; // Черный
} else if (userText.includes("бел")) {
    cubeColor = 0xffffff; // Белый
}

    // Создаём материал с выбранным цветом
    const material = new THREE.MeshStandardMaterial({ color: cubeColor });
    
    // Создаем пустой контейнер (объект), в который будем складывать части
    const cube = new THREE.Group(); 

    // Проверяем: если написано "стол", собираем стол. Иначе — делаем обычную фигуру.
    if (userText.includes("стол")) {
        
        // 1. Столешница (широкая и плоская)
        const topGeo = new THREE.BoxGeometry(2, 0.2, 1);
        const top = new THREE.Mesh(topGeo, material);
        top.position.y = 0.5; // Поднимаем её наверх
        cube.add(top);

        // 2. Ножки стола (4 штуки)
        const legGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
        
        // Ножка 1 (передняя левая)
        const leg1 = new THREE.Mesh(legGeo, material);
        leg1.position.set(-0.8, -0.1, -0.4);
        cube.add(leg1);

        // Ножка 2 (передняя правая)
        const leg2 = new THREE.Mesh(legGeo, material);
        leg2.position.set(0.8, -0.1, -0.4);
        cube.add(leg2);

        // Ножка 3 (задняя левая)
        const leg3 = new THREE.Mesh(legGeo, material);
        leg3.position.set(-0.8, -0.1, 0.4);
        cube.add(leg3);

        // Ножка 4 (задняя правая)
        const leg4 = new THREE.Mesh(legGeo, material);
        leg4.position.set(0.8, -0.1, 0.4);
        cube.add(leg4);
        
    } else {
        // Если это не стол, то просто берем нашу фигуру (геометрию) и создаем её
        const mesh = new THREE.Mesh(geometry, material);
        mesh.scale.set(scaleX, scaleY, scaleZ);
        cube.add(mesh);
    }

    scene.add(cube); // Добавляем собранный объект в сцену

    // 6. Добавляем свет (иначе куб будет чёрным)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 7. Функция анимации (вызывается много раз в секунду)
    function animate() {
        requestAnimationFrame(animate); // Просим браузер вызвать эту функцию снова

        // Вращаем куб
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
       
        controls.update()

        // Рисуем сцену
        renderer.render(scene, camera);
    }

    // Запускаем анимацию!
    animate();

    // 8. Обработка изменения размера экрана (чтобы 3D не ломалось)
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
